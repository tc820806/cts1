; Desktop visualizer (DesktopCava.qml): Caelestia's settings, 60 bars at 60 fps, 0-1000, ";"-separated.
[general]
bars = 60
framerate = 60
autosens = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59

[smoothing]
noise_reduction = 85
monstercat = 0
waves = 0
